name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  main-source:
    name: main source
    runs-on: ubuntu-latest
    steps:
      - name: Require sandbox as the source of main pull requests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$BASE_REF" == "main" ]]; then
            [[ "$HEAD_REF" == "sandbox" && "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]] || {
              echo "Pull requests to main must come from walid-baharwal/handoff:sandbox."
              exit 1
            }
          fi

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: npm test --prefix npm
      - run: npm test --prefix vscode
      - if: runner.os == 'Linux'
        run: docker build -t handoff:test .
      - if: runner.os == 'Linux'
        name: Build and smoke-test npm packages
        run: |
          bash scripts/build-release-binaries.sh 0.0.0-ci npm/test-binaries
          node npm/scripts/prepare-packages.mjs --version 0.0.0-ci --binaries npm/test-binaries --output npm/dist
          node npm/scripts/verify-packages.mjs npm/dist
          node npm/scripts/smoke.mjs npm/dist
      - if: runner.os == 'Linux'
        name: Build VS Code extension packages
        run: |
          npm ci --prefix vscode
          node vscode/scripts/package-vsix.mjs --version 0.0.0-ci --binaries npm/test-binaries --output vscode/dist
